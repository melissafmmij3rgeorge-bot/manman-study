<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="zy1AnM8ulhvHsYGp1nGrGh">
<head data-page-node-id="OWJL4WwEaFDADQ2ju0iEfo">
<meta charset="UTF-8" data-page-node-id="PGVVK98MsV6n99BHjqusq7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" data-page-node-id="EHhAtuEtI4b7DbAqxA9lbZ">
<meta name="theme-color" content="#4A90E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="满满大闯关">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>满满大闯关</title>
<style>
  :root{
    --bg:#FFF8F0; --card:#FFFFFF; --ink:#3A2E2A; --muted:#8A7A70;
    --coral:#FF8A4C; --coral-deep:#E86A2A; --teal:#2BBFA0; --blue:#4A9BFF;
    --amber:#FFC24B; --green:#4CAF50; --red-soft:#F5A9A9; --border:#EFE3D6;
    --soft-shadow:0 2px 0 rgba(0,0,0,.04);
    --purple:#9B6BCC; --pink:#E67AA0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    touch-action:manipulation;}
  #app{max-width:760px;margin:0 auto;padding:16px 20px 40px;min-height:100vh;
    display:flex;flex-direction:column;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .title{font-size:20px;font-weight:600;letter-spacing:.5px;flex:1;}
  .prog{font-size:15px;font-weight:600;color:var(--teal);}
  .profile-tag{font-size:13px;color:var(--muted);background:var(--card);
    padding:4px 10px;border-radius:12px;border:1px solid var(--border);cursor:pointer;}
  .speaker{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);
    background:var(--card);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

  /* ================= 学科 Tab 切换 ================= */
  .subject-tab{display:flex;gap:6px;margin:8px 0 14px;background:var(--card);
    padding:6px;border-radius:16px;border:1px solid var(--border);}
  .tab-btn{flex:1;min-height:48px;border:none;background:transparent;
    font-size:16px;font-weight:600;color:var(--muted);border-radius:12px;
    cursor:pointer;transition:background .2s ease, color .2s ease;
    display:flex;align-items:center;justify-content:center;gap:4px;}
  .tab-btn.on.math{background:var(--coral);color:#fff;}
  .tab-btn.on.chinese{background:var(--purple);color:#fff;}
  .tab-btn.on.english{background:var(--blue);color:#fff;}

  /* ================= IP 向导角色 ================= */
  .mascot-hero{width:120px;height:120px;object-fit:contain;margin:8px auto;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));animation:float 3s ease-in-out infinite;}
  .mascot-win{width:160px;height:160px;object-fit:contain;margin:10px auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2));animation:bounce 1.2s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes bounce{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .mascot-name{font-size:15px;font-weight:600;color:var(--muted);margin-top:-4px;}

  section{display:none;flex:1;flex-direction:column;}
  section.active{display:flex;}

  .big{font-size:24px;font-weight:700;line-height:1.4;}
  .mid{font-size:19px;line-height:1.6;}
  .hint{font-size:16px;line-height:1.6;color:var(--muted);}
  .center{text-align:center;}
  .hero-emoji{font-size:60px;margin:18px 0 6px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;
    min-height:60px;padding:0 28px;border-radius:18px;border:none;cursor:pointer;
    font-size:19px;font-weight:600;color:#fff;background:var(--coral);
    transition:transform .12s ease;}
  .btn:active{transform:scale(.96);}
  .btn.secondary{background:var(--teal);}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--border);}
  .btn.tiny{min-height:44px;padding:0 16px;font-size:16px;border-radius:14px;}
  .btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center;}

  .task-card{background:var(--card);border:0.5px solid var(--border);border-radius:16px;
    padding:18px 20px;margin:12px 0;text-align:left;box-shadow:var(--soft-shadow);}
  .task-label{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .task-main{font-size:20px;font-weight:600;}

  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;margin:16px auto;min-height:130px;}

  .grid{display:grid;gap:8px;justify-content:center;}
  .blk{border-radius:12px;background:var(--coral);
    transition:transform .25s ease, background .25s ease, opacity .25s ease;
    animation:popIn .45s ease backwards;}
  @keyframes popIn{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  .blk.empty{background:transparent;border:2px dashed #D8C4B0;}
  .blk.dim{opacity:.35;}

  .pill{display:inline-block;padding:8px 16px;border-radius:12px;font-size:18px;font-weight:700;}
  .pill.coral{background:#FFE3D2;color:#C24E16;}
  .pill.blue{background:#DDEBFF;color:#185FA5;}
  .pill.amber{background:#FFF0D0;color:#8A5B00;}
  .pill.green{background:#E1F3DF;color:#2E7D32;}
  .pill.red{background:#FDEBEB;color:#C0392B;}
  .pill.purple{background:#EAD9F5;color:#5B2C8A;}

  .cmp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;}
  .vs{font-size:22px;font-weight:700;color:var(--coral-deep);}

  .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px auto;width:100%;max-width:520px;}
  .opt{min-height:80px;border-radius:18px;border:2px solid var(--border);background:var(--card);
    font-size:28px;font-weight:700;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:8px;
    transition:transform .12s ease, border-color .2s ease, background .2s ease;}
  .opt:active{transform:scale(.96);}
  .opt.right{background:#E7F6E9;border-color:var(--green);color:#2E7D32;}
  .opt.wrong{background:#FDEBEB;border-color:var(--red-soft);color:#C0392B;}

  #practiceQText{font-size:30px;font-weight:700;line-height:1.4;margin:10px 0;color:var(--ink);}
  #reviewQ{font-size:30px;font-weight:700;line-height:1.4;margin:10px 0;color:var(--ink);}
  #mindQ{font-size:28px;font-weight:700;line-height:1.4;margin:10px 0;color:var(--ink);}
  .progress-dots{display:flex;gap:8px;justify-content:center;align-items:center;margin:6px 0;}
  .progress-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .2s;}
  .progress-dot.on{background:var(--coral);}
  .progress-text{font-size:15px;color:var(--muted);margin-top:4px;}

  .track-card{background:var(--card);border-radius:14px;padding:14px 18px;margin:8px 0;border:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .track-label{font-size:13px;color:var(--muted);font-weight:500;}
  .track-value{font-size:18px;font-weight:600;color:var(--ink);}
  .track-emoji{font-size:24px;}

  .feedback{min-height:34px;font-size:18px;font-weight:600;text-align:center;margin:10px 0;}
  .feedback.good{color:var(--green);}
  .feedback.soft{color:var(--coral-deep);}

  .star-rain{position:relative;height:180px;overflow:hidden;}
  .drop{position:absolute;top:-30px;font-size:30px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(220px);opacity:0;}}

  .step-dots{display:flex;gap:8px;justify-content:center;margin:14px 0;}
  .dot{width:10px;height:10px;border-radius:50%;background:#E0D2C4;}
  .dot.on{background:var(--coral);}

  .profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:24px auto;max-width:480px;width:100%;}
  .profile-card{background:var(--card);border:2px solid var(--border);border-radius:22px;
    padding:30px 16px;cursor:pointer;text-align:center;transition:transform .12s ease, border-color .2s;}
  .profile-card:active{transform:scale(.97);}
  .profile-card .emoji{font-size:64px;display:block;margin-bottom:10px;}
  .profile-card .name{font-size:22px;font-weight:700;color:var(--ink);}
  .profile-card .desc{font-size:13px;color:var(--muted);margin-top:6px;}

  .gate-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,248,240,.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    z-index:10;border-radius:18px;}
  .gate-text{font-size:22px;font-weight:700;text-align:center;max-width:380px;line-height:1.4;}
  .gate-tip{font-size:14px;color:var(--muted);text-align:center;}

  .energy-bar{display:flex;gap:8px;justify-content:center;margin:14px auto;}
  .energy-cell{width:42px;height:18px;border-radius:6px;background:#E0D2C4;
    transition:background .3s ease, transform .3s ease;}
  .energy-cell.on{background:var(--coral);transform:scale(1.05);}
  .energy-cell.warn{background:var(--amber);animation:pulseWarn 1s ease-in-out infinite;}
  @keyframes pulseWarn{0%,100%{opacity:1;}50%{opacity:.55;}}

  .explore-pad{display:flex;flex-direction:column;gap:14px;align-items:center;margin:10px auto;max-width:520px;width:100%;}
  .explore-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;}
  .explore-cell{min-height:64px;border-radius:14px;background:var(--card);border:2px solid var(--border);
    font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .12s ease;}
  .explore-cell:active{transform:scale(.96);}
  .explore-emoji{font-size:38px;}

  .interact-prompt{background:var(--card);border:2px dashed var(--coral);border-radius:14px;
    padding:14px 18px;margin:10px auto;font-size:18px;text-align:center;max-width:420px;}
  .interact-bubble{background:var(--amber);color:#6B4A00;border-radius:16px;
    padding:12px 20px;font-size:22px;font-weight:700;margin:8px auto;display:inline-block;
    animation:popIn .4s ease;}

  .visual-row{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:6px 0;}
  .box-group{display:flex;flex-direction:column;align-items:center;gap:6px;animation:popIn .45s ease backwards;}
  .box{width:78px;height:62px;border-radius:12px;background:linear-gradient(135deg,#FFE8D2 0%,#FFD4A8 100%);
    border:2px solid #E8B481;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    padding:6px;gap:5px;box-shadow:0 4px 0 #E8B481;}
  .candy{width:15px;height:15px;border-radius:50%;background:var(--coral);
    box-shadow:inset -2px -2px 0 rgba(0,0,0,.1);}
  .box-label{font-size:13px;color:var(--muted);}

  .clothes{display:flex;gap:30px;justify-content:center;align-items:flex-end;}
  .shirt-col,.pants-col{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .garment{width:48px;display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 4px 0 rgba(0,0,0,.08);animation:popIn .45s ease backwards;}
  .garment.shirt{height:54px;border-radius:10px 10px 6px 6px;}
  .garment.pants{height:46px;border-radius:6px 6px 14px 14px;}
  .clothes-label{font-size:13px;color:var(--muted);}

  .people-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:340px;}
  .person{font-size:28px;animation:popIn .4s ease backwards;}

  .hare{display:flex;gap:26px;justify-content:center;align-items:flex-start;}
  .hare-side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:120px;}
  .hare-emoji{font-size:44px;}
  .carrot-groups{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:340px;}
  .carrot-group{border:2px dashed #D8C4B0;border-radius:14px;padding:8px;display:flex;gap:4px;align-items:center;
    justify-content:center;min-width:46px;min-height:46px;animation:popIn .45s ease backwards;}
  .carrot{width:12px;height:32px;border-radius:6px;background:linear-gradient(#FF8A4C 72%,#4CAF50 72%);position:relative;}
  .carrot:before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:10px;height:8px;background:#4CAF50;border-radius:4px 4px 0 0;}
  .carrot-group.highlight{border-color:var(--coral);background:#FFF3E8;}

  .summary-list{display:flex;flex-direction:column;gap:10px;max-width:480px;width:100%;margin:16px auto;}
  .summary-item{background:var(--card);border-radius:14px;padding:14px 18px;display:flex;
    align-items:center;justify-content:space-between;border:1px solid var(--border);}

  .share-row{display:flex;gap:28px;justify-content:center;align-items:flex-start;}
  .share-person{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:96px;}
  .cookie-row{display:flex;flex-wrap:wrap;gap:4px;max-width:120px;justify-content:center;}
  .cookie{font-size:22px;animation:popIn .4s ease backwards;}

  .ruler-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0;}
  .ruler{display:flex;border:2px solid #E8B481;border-radius:8px;background:#FFFDF8;overflow:hidden;}
  .ruler-seg{width:40px;height:52px;border-right:1px solid #E8B481;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;font-size:14px;color:var(--muted);position:relative;}
  .ruler-seg:last-child{border-right:none;}
  .ruler-seg .num{position:absolute;top:8px;font-size:13px;color:var(--ink);}
  .ruler-seg.highlight{background:#FFF0D0;}
  .ruler-seg.highlight .num{color:var(--coral-deep);font-weight:700;}

  .pattern-row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0;}
  .pattern-item{font-size:36px;animation:popIn .4s ease backwards;}
  .pattern-item.gap{opacity:.5;filter:grayscale(.4);}
  .pattern-grp{display:inline-flex;gap:6px;border:2px solid var(--coral);border-radius:10px;padding:4px 8px;
    background:#FFF3E8;animation:popIn .4s ease;}
  .pattern-grp .pattern-item{font-size:28px;}

  /* ================= 英语 KET 单元图例 ================= */
  .word-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px auto;max-width:480px;}
  .word-card{background:var(--card);border:2px solid var(--border);border-radius:14px;
    padding:10px 6px;text-align:center;animation:popIn .4s ease backwards;}
  .word-card .emoji{font-size:38px;display:block;margin-bottom:4px;}
  .word-card .en{font-size:16px;font-weight:700;color:var(--blue);}
  .word-card .zh{font-size:12px;color:var(--muted);margin-top:2px;}
  .word-card.speaker-btn{cursor:pointer;transition:transform .12s ease;}
  .word-card.speaker-btn:active{transform:scale(.95);}
  .word-card.speaker-zh{cursor:pointer;transition:transform .12s ease;}
  .word-card.speaker-zh:active{transform:scale(.95);}
  .word-card .han{font-size:24px;font-weight:700;color:#222;line-height:1.1;}
  .word-card .pin{font-size:12px;color:var(--muted);margin-top:2px;}
  .word-card .pinBig{font-size:18px;font-weight:700;color:var(--blue);margin-top:2px;}
  .word-card.highlight{border-color:var(--blue);background:#E8F1FF;}
  .word-card.wrong{border-color:var(--red-soft);background:#FDEBEB;}

  .scene-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
  .scene-item{display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 12px;background:var(--card);border:2px solid var(--border);border-radius:12px;
    animation:popIn .4s ease backwards;min-width:80px;}
  .scene-item .emoji{font-size:32px;}
  .scene-item .label{font-size:12px;color:var(--muted);}

  .ket-sentence{font-size:24px;font-weight:600;line-height:1.5;margin:8px 0;color:var(--blue);}
  .ket-sentence .blank{color:var(--coral);font-weight:700;text-decoration:underline;}

  .sound-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 16px;background:var(--blue);color:#fff;border-radius:12px;font-size:16px;
    font-weight:600;cursor:pointer;border:none;}
  .sound-btn:active{transform:scale(.96);}

  /* ===== v6.1 语文+数学新增样式 ===== */
  .bs-card{background:var(--card);border:2px solid var(--green);border-radius:14px;padding:14px;margin:8px auto;max-width:280px;text-align:center;}
  .bs-han{font-size:56px;font-weight:700;color:#222;line-height:1.2;font-family:"KaiTi","Microsoft YaHei",serif;}
  .bs-strokes{font-size:14px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;}
  .bs-step{display:inline-block;padding:3px 8px;background:#E8F8E8;border:1px solid var(--green);border-radius:6px;color:#2A6F2A;}
  .bs-arrow{color:var(--muted);font-size:12px;padding:0 2px;}
  .bs-mini{padding:8px;}
  .hint-mini{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ===== v6.2 方向图（校园小导游）+ 田字格笔顺跟写 ===== */
  .dir-map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:250px;margin:12px auto;}
  .dir-cell{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-weight:700;font-size:18px;}
  .dir-cell.n{background:var(--blue);color:#fff;border-color:var(--blue);}
  .dir-cell.s{background:var(--coral);color:#fff;border-color:var(--coral);}
  .dir-cell.w{background:var(--green);color:#fff;border-color:var(--green);}
  .dir-cell.e{background:var(--amber);color:#5A4300;border-color:var(--amber);}
  .dir-cell.c{background:transparent;border:none;font-size:30px;}
  .dir-cell.sm{font-size:15px;padding:8px 6px;font-weight:600;}

  .tz-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:12px 0;}
  .tz-grid{position:relative;width:260px;height:260px;max-width:62vw;max-height:62vw;background:#fff;border:2px solid var(--coral);border-radius:10px;overflow:hidden;touch-action:none;}
  .tz-grid::before,.tz-grid::after{content:"";position:absolute;background:#F3D3BC;}
  .tz-grid::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-.5px);}
  .tz-grid::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-.5px);}
  .tz-ghost{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:190px;line-height:1;color:#EADFD4;font-family:"KaiTi","Microsoft YaHei",serif;user-select:none;pointer-events:none;}
  .tz-canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;}
  .tz-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .tz-word-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0;}
  .tz-chip{padding:8px 14px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-size:22px;
    font-family:"KaiTi","Microsoft YaHei",serif;cursor:pointer;font-weight:700;}
  .tz-chip.on{background:var(--coral);color:#fff;border-color:var(--coral);}

  .balloon-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:28px;margin:10px 0;}
  .balloon{display:inline-block;padding:6px;border-radius:50%;min-width:36px;text-align:center;}

  .stat-table{width:90%;margin:10px auto;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;}
  .stat-table th,.stat-table td{padding:8px 12px;border:1px solid var(--border);text-align:center;}
  .stat-table th{background:#FFE3D2;color:var(--coral-deep);font-weight:600;}

  .season-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;}
  .season-cell{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
  .season-icon{font-size:32px;margin-bottom:4px;}

  .scene-line{font-size:16px;line-height:1.8;margin:6px 0;text-align:center;}
  .scene-line .em{color:var(--coral-deep);font-weight:700;}

  .poem{background:#FFFBEA;border:2px dashed #FFC24B;border-radius:12px;padding:14px;line-height:1.8;font-size:15px;text-align:center;}
</style>

  /* ================= 工具 ================= */
  var numCN=['零','一','二','三','四','五','六','七','八','九','十'];
  function readNum(n){
    if(n<10) return numCN[n];
    if(n===10) return '一十';
    if(n<20) return '十'+numCN[n-10];
    return numCN[Math.floor(n/10)]+'十'+(n%10?numCN[n%10]:'');
  }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
  function makeOpts(ans, distractors){
    var set=[ans];
    distractors.forEach(function(d){ if(d>0 && d!==ans && set.indexOf(d)<0) set.push(d); });
    var guard=0;
    while(set.length<4 && guard<100){
      var v=ans+rnd(-3,3);
      if(v>0 && set.indexOf(v)<0) set.push(v);
      guard++;
    }
    return shuffle(set);
  }

  /* ================= 语音 / 音效 ================= */
  var _zhVoice=null, _enVoice=null;
  function _initVoices(){
    if(!window.speechSynthesis) return;
    try{
      var vs=window.speechSynthesis.getVoices();
      if(!vs || !vs.length) return;
      _zhVoice = vs.find(function(v){return /zh[-_]CN/i.test(v.lang) && v.localService;})
              || vs.find(function(v){return /zh[-_]CN/i.test(v.lang);})
              || vs.find(function(v){return /zh/i.test(v.lang);});
      _enVoice = vs.find(function(v){return /en[-_]US/i.test(v.lang) && v.localService;})
              || vs.find(function(v){return /en[-_]US/i.test(v.lang);})
              || vs.find(function(v){return /en/i.test(v.lang);});
    }catch(e){}
  }
  if(window.speechSynthesis){
    _initVoices();
    window.speechSynthesis.onvoiceschanged = _initVoices;
  }
  var _speakTimer=null;
  function speak(text, lang){
    if(!text) return;
    try{
      if(!('speechSynthesis' in window)) return;
      var synth=window.speechSynthesis;
      var u=new SpeechSynthesisUtterance(text);
      var isEn = /^en/i.test(lang||'');
      u.lang = lang || 'zh-CN';
      if(isEn){ u.voice = _enVoice || null; }
      else { u.voice = _zhVoice || null; }
      u.rate = 0.95;       // 自然语速，不再偏慢拖沓
      u.pitch = 1.0;       // 自然音高，不再偏高发尖
      u.volume = 1.0;
      synth.cancel();      // 清掉排队中的旧语音
      // 加 30ms 缓冲，避免 iOS cancel→speak 连续调用导致的吞音/卡顿
      clearTimeout(_speakTimer);
      _speakTimer = setTimeout(function(){
        try{ synth.speak(u); }catch(e){}
      }, 30);
    }catch(e){}
  }
  function speakZH(t){ speak(t,'zh-CN'); }
  function speakEN(t){ speak(t,'en-US'); }
  var actx=null;
  function ensureAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state==='suspended') actx.resume();
  }
  function tone(freq,t0,dur,vol){
    if(!actx) return;
    var o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq; g.gain.value=vol||0.11;
    o.connect(g); g.connect(actx.destination);
    var s=actx.currentTime+t0;
    g.gain.setValueAtTime(0.0001,s);
    g.gain.linearRampToValueAtTime(vol||0.11,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
    o.start(s); o.stop(s+dur+0.05);
  }
  function playCorrect(){ tone(523,0,0.14); tone(659,0.12,0.14); tone(784,0.24,0.22); }
  function playPop(){ tone(520,0,0.07,0.08); }
  function playWarn(){ tone(440,0,0.18,0.10); tone(440,0.22,0.18,0.10); }
  function playWin(){ [523,659,784,1046].forEach(function(f,i){ tone(f,i*0.13,0.22,0.11); }); }

  function ruler(len, mark){
    var s='<div class="ruler-wrap"><div class="hint">尺子 · 一小格 = 1 厘米</div><div class="ruler">';

  function patternSeq(arr, gapIdx, groupLen){
    var s='<div class="pattern-row">';
    for(var i=0;i<arr.length;i++){
      var start=(groupLen && i%groupLen===0);
      if(start) s+='<span class="pattern-grp">';
      if(i===gapIdx){
        s+='<span class="pattern-item gap">❓</span>';
      } else {
        s+='<span class="pattern-item" style="animation-delay:'+(i*0.06)+'s">'+arr[i]+'</span>';
      }
      if(groupLen && (i+1)%groupLen===0) s+='</span>';
    }
    if(groupLen && arr.length%groupLen!==0) s+='</span>';
    s+='</div>';
    return s;
  }

  /* ================= 身份系统 ================= */

    if(isTest()){ state={}; return; }

  }

    if(isTest()) return;

  function masteredCount(){
    var units=UNITS_BY_SUBJECT[currentSubject]||[];

  }
  function markLearned(id,ok){
    if(isTest()) return;
    var st=getSt(id), lv=(st&&st.lv?st.lv:0);
    if(ok){ lv=lv+1; if(lv>5) lv=5; }
    else { lv=1; }
    state[id]={lv:lv, due:addDays(today(), INTERVALS[lv]||1)};
    saveState();
  }

    if(isTest()) return;
    try{
      var all=JSON.parse(localStorage.getItem(timesKey())||'{}');
      if(!all[unitId]) all[unitId]=[];

  /* ================= 学期周次 ================= */
  var TERM_START_Y=2026, TERM_START_M=8, TERM_START_D=1;
  function getCurrentWeek(){
    var now=new Date();
    var start=new Date(TERM_START_Y, TERM_START_M, TERM_START_D);
    var days=Math.floor((now-start)/(1000*60*60*24));
    if(days<0) return 0;
    return Math.floor(days/7)+1;
  }
  function isUnlocked(u){
    return (u.unlockWeek||0) <= getCurrentWeek();
  }

  /* ================= 每日计划（按学科） ================= */
  var todayDue=[], todayNew=null;
  var MAX_DUE_PER_DAY=3;
  function planDay(){
    loadState();
    var units=UNITS_BY_SUBJECT[currentSubject]||[];
    todayDue=[];
    if(!isTest()){
      var t=today();
      var dueList=[];
      for(var i=0;i<units.length;i++){ var u=units[i]; var st=getSt(u.id);
        if(!isUnlocked(u)) continue;
        if(st && st.lv>=1 && cmpDate(st.due,t)<=0) dueList.push({u:u, due:st.due}); }
      dueList.sort(function(a,b){ return cmpDate(a.due, b.due); });
      if(dueList.length>MAX_DUE_PER_DAY){
        var tomorrow=addDays(t, 1);
        for(var j=MAX_DUE_PER_DAY;j<dueList.length;j++){
          var st2=getSt(dueList[j].u.id);
          if(st2) st2.due=tomorrow;
        }
        dueList=dueList.slice(0, MAX_DUE_PER_DAY);
      }
      for(var k=0;k<dueList.length;k++) todayDue.push(dueList[k].u);
    }
    todayNew=nextNewUnit();
    if(!isTest()) saveState();
  }
  function nextNewUnit(){
    var units=UNITS_BY_SUBJECT[currentSubject]||[];
    for(var i=0;i<units.length;i++){ var u=units[i];
      if(!isUnlocked(u)) continue;
      var st=getSt(u.id);
      if(!st || st.lv===0) return u; }
    return null;
  }

        opts.map(function(o){return '<button class="btn tiny" data-v="'+o+'">'+o+'</button>';}).join('')+

        '<div style="margin-top:12px;"><button class="sound-btn" id="ketSoundBtn">🔊 Listen</button></div>'+

      var speakBtn=document.getElementById('ketSoundBtn');
      if(speakBtn) speakBtn.addEventListener('click', function(){ speak(it.word,'en-US'); });
      p.querySelectorAll('button[data-v]').forEach(function(b){
        b.addEventListener('click',function(){
          var v=b.getAttribute('data-v');

            b.style.background='#4CAF50'; b.style.color='#fff';
            p.innerHTML+='<div class="interact-bubble">Great! 👏 '+it.word+'</div>';

  function onExploreMathTap(n){

      pending.classList.remove('pending');

  function getMindField(){
    if(currentSubject==='math') return MIND_FIELD_MATH;
    if(currentSubject==='english') return MIND_FIELD_EN;
    return MIND_FIELD_ZH;

  var todayMindQs=[];
  function planMindField(){
    todayMindQs=[];
    var field=getMindField();
    var used={};
    var n=rnd(3,5);
    var guard=0;
    while(todayMindQs.length<n && guard<100){
      var f=field[rnd(0,field.length-1)];
      var key=f.id+'_'+today();
      if(used[key]) {guard++; continue;}
      used[key]=1;
      var q=f.gen();
      todayMindQs.push({family:f, q:q});
      guard++;
    }
  }
  var mindIdx=0, mindOk=0;
  function startMindField(){
    mindIdx=0; mindOk=0;
    if(!todayMindQs.length) planMindField();
    show('screen-mind');
    renderMindQ();
  }
  function renderMindQ(){
    if(mindIdx>=todayMindQs.length){ finishMindField(); return; }
    var item=todayMindQs[mindIdx];
    var q=item.q;
    var isEn=(currentSubject==='english');
    document.getElementById('mindProgress').innerHTML=
      '<div class="progress-text">'+(isEn?'Mind · Q '+(mindIdx+1)+' of '+todayMindQs.length:'思维场 · 第 '+(mindIdx+1)+' 题 · 共 '+todayMindQs.length+' 题')+'</div>'+
      renderDots(todayMindQs.length, mindIdx);
    document.getElementById('mindFamily').textContent=item.family.icon+' '+item.family.name;
    document.getElementById('mindQ').textContent=q.q;
    document.getElementById('mindFeedback').textContent='';
    document.getElementById('mindFeedback').className='feedback';
    var box=document.getElementById('mindOpts');
    renderOpts(box, q.opts, function(v,o,box){
      box.dataset.lock='1';
      if(v===q.ans){
        o.classList.add('right'); mindOk++; playCorrect();
        document.getElementById('mindFeedback').textContent=isEn?'Correct! 🎉':'对啦！';
        document.getElementById('mindFeedback').className='feedback good';
        speak(isEn?'Correct!':'对啦！', isEn?'en-US':'zh-CN');
        setTimeout(function(){ mindIdx++; renderMindQ(); }, 900);
      } else {
        o.classList.add('wrong');
        addWrong({id:'m|'+currentSubject+'|'+item.family.id+'|'+q.q, subject:currentSubject, unitName:'思维场·'+item.family.name, q:q.q, opts:q.opts, ans:q.ans});
        document.getElementById('mindFeedback').textContent=isEn?'Try again':'再想想';
        document.getElementById('mindFeedback').className='feedback soft';
        speak(isEn?'Try again':'再想想', isEn?'en-US':'zh-CN');

    var h='<div class="hint" style="margin:4px 24px;">60 秒口算挑战！选一个关卡，答对越多越厉害。</div><div style="width:100%;max-width:480px;margin:8px auto;">';
    SPRINT_LEVELS.forEach(function(lv){
      h+='<div class="task-card" style="cursor:pointer;" data-sl="'+lv.id+'"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="task-main">⚡ '+lv.name+'</div><div class="task-label" style="margin:0;">'+(best[lv.id]!==undefined?'最佳 '+best[lv.id]+' 题':'还没挑战')+'</div></div></div>';
    });
    h+='</div>';
    st.innerHTML=h;
    st.querySelectorAll('[data-sl]').forEach(function(c){
      c.addEventListener('click',function(){ ensureAudio(); var lv=SPRINT_LEVELS.filter(function(x){return x.id===c.dataset.sl;})[0]; if(lv) startSprint(lv); });
    });
  }
  function startSprint(lv){
    stopSprint();
    sprint={lv:lv, left:60, score:0, wrong:0, total:0};
    renderSprintQ();
    speak('口算挑战开始！','zh-CN');
    sprintTimer=setInterval(function(){
      if(!sprint){ stopSprint(); return; }
      sprint.left-=1;
      var bar=document.getElementById('sprintBar');
      if(bar){ bar.style.width=Math.max(0,sprint.left/60*100)+'%'; if(sprint.left<=10) bar.style.background='var(--coral)'; }
      var t=document.getElementById('sprintTime');
      if(t) t.textContent=sprint.left;
      if(sprint.left<=0){ stopSprint(); finishSprint(lv); }
    },1000);
  }
  function renderSprintQ(){
    var st=document.getElementById('sprintStage');
    var q=sprint.lv.gen();
    sprint.total++;
    var opts=makeOpts(q.ans,[q.ans+1,q.ans-1,q.ans+2]);
    var h='<div style="width:100%;max-width:480px;margin:0 auto 8px;display:flex;justify-content:space-between;align-items:center;">'+
      '<div class="hint" style="margin:0;">⚡ '+sprint.lv.name+'</div>'+
      '<div class="hint" style="margin:0;">⏱ <span id="sprintTime">'+sprint.left+'</span> 秒</div>'+
      '<div class="hint" style="margin:0;">⭐ '+sprint.score+'</div></div>'+
      '<div style="width:100%;max-width:480px;margin:0 auto 8px;height:12px;border-radius:8px;background:var(--border);overflow:hidden;"><div id="sprintBar" style="height:100%;width:'+(sprint.left/60*100)+'%;background:var(--teal);transition:width .3s;"></div></div>'+
      '<div class="big" id="sprintQText">'+q.q+'</div>'+
      '<div id="sprintOpts" class="opts"></div>'+
      '<div class="feedback" id="sprintFeedback"></div>';
    st.innerHTML=h;
    var box=document.getElementById('sprintOpts');
    renderOpts(box, opts, function(v,o,box){
      box.dataset.lock='1';
      if(v===q.ans){
        o.classList.add('right'); sprint.score++; playPop();
        setTimeout(function(){ if(sprint) renderSprintQ(); }, 280);
      } else {
        o.classList.add('wrong'); sprint.wrong++;
        box.querySelectorAll('.opt').forEach(function(x){ if(x.textContent===''+q.ans) x.classList.add('right'); });
        addWrong({id:'sp|'+sprint.lv.id+'|'+q.q, subject:'math', unitName:'口算·'+sprint.lv.name, q:q.q, opts:opts, ans:q.ans});
        document.getElementById('sprintFeedback').textContent='正确答案：'+q.ans;
        setTimeout(function(){ if(sprint) renderSprintQ(); }, 950);
      }
    });
  }
  function finishSprint(lv){
    var score=sprint?sprint.score:0, wcnt=sprint?sprint.wrong:0;
    sprint=null;
    var best=loadSprint(); if(!best.best) best.best={};
    var isNew=false;
    if(!isTest() && score>0 && score>(best.best[lv.id]||0)){ best.best[lv.id]=score; isNew=true; saveSprintBest(best); }
    var st=document.getElementById('sprintStage');
    var h='<div class="hero-emoji">'+(score>=20?'🏆':(score>=10?'🎉':'💪'))+'</div>'+
      '<div class="big">时间到！</div>'+
      '<div class="summary-list">'+
      '<div class="summary-item"><div class="task-label" style="margin:0;">答对</div><div class="task-main">'+score+' 题</div></div>'+
      '<div class="summary-item"><div class="task-label" style="margin:0;">答错</div><div class="task-main">'+wcnt+' 题</div></div>'+
      (isNew?'<div class="summary-item"><div class="task-label" style="margin:0;">纪录</div><div class="task-main">新纪录！🎉</div></div>':'')+
      '</div>'+
      (wcnt?'<div class="hint" style="margin:6px 24px;">错题已自动放进错题本</div>':'')+
      '<div class="btn-row"><button class="btn secondary" id="sprintAgain">再来一次</button></div>';
    st.innerHTML=h;
    playWin();
    speak('时间到！一共答对'+score+'题'+(isNew?'，新纪录！':''), 'zh-CN');
    document.getElementById('sprintAgain').addEventListener('click',function(){ ensureAudio(); startSprint(lv); });
    renderHome();
  }

  /* ================= 错题本界面 ================= */
  function openMistakes(){ show('screen-mistakes'); renderMistakes(); }
  function mistakeItems(){
    var w=loadWrong(), arr=[];
    if(w.items) for(var k in w.items){ var it=w.items[k]; if(it){ it.id=k; arr.push(it); } }
    arr.sort(function(a,b){ return (b.last||0)-(a.last||0); });
    return arr;
  }
  function renderMistakes(){
    var st=document.getElementById('mistStage');
    var items=mistakeItems();
    var dw=dictWrongWords();
    if(!items.length && !dw.length){
      st.innerHTML='<div class="hero-emoji">🎉</div><div class="big">还没有错题！</div><div class="hint" style="margin:8px 24px;">做单元练习、口算、听写时错的题会自动收进来，等你来消灭它们。</div>';
      return;
    }
    var h='<div class="hint" style="margin:4px 24px;">点一条错题可以单独重练；连对几次，它就会"出本"。</div>';
    if(items.length){
      var groups={};
      items.forEach(function(it){ if(!groups[it.subject]) groups[it.subject]=[]; groups[it.subject].push(it); });
      [['math','🧮 数学'],['chinese','📖 语文'],['english','🇬🇧 英语']].forEach(function(g){
        var its=groups[g[0]]; if(!its||!its.length) return;
        h+='<div class="hint" style="max-width:480px;margin:14px auto 2px;text-align:left;font-weight:700;">'+g[1]+' · '+its.length+' 题</div><div style="width:100%;max-width:480px;margin:4px auto;">';
        its.forEach(function(it){
          h+='<div class="task-card" style="cursor:pointer;padding:10px 14px;" data-mk="'+escapeHtml(it.id)+'"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><div class="task-main" style="font-size:17px;">'+escapeHtml(it.q)+'</div><div class="task-label" style="margin:0;white-space:nowrap;">'+escapeHtml(it.unitName||'')+' · 错 '+(it.wc||1)+' 次</div></div></div>';
        });
        h+='</div>';
      });
      h+='<div class="btn-row"><button class="btn" id="mkPractice">开始错题重练（'+items.length+' 题）</button></div>';
    }
    if(dw.length){
      h+='<div class="hint" style="max-width:480px;margin:14px auto 2px;text-align:left;font-weight:700;">✍️ 听写错词 · '+dw.length+' 个</div><div class="word-grid" style="max-width:420px;">';
      dw.forEach(function(w){ var wd=findDictWord(w)||[w,'','']; h+='<div class="word-card"><div class="han">'+w+'</div><div class="pin">'+wd[1]+'</div><div class="hint-mini">'+wd[2]+'</div></div>'; });
      h+='</div><div class="btn-row"><button class="btn secondary" id="mkDict">把错词再听写一遍</button></div>';
    }
    st.innerHTML=h;
    st.querySelectorAll('[data-mk]').forEach(function(c){
      c.addEventListener('click',function(){ ensureAudio(); showMistakeDetail(c.dataset.mk); });
    });
    var pb=document.getElementById('mkPractice'); if(pb) pb.addEventListener('click',function(){ ensureAudio(); startMistakePractice(); });
    var db=document.getElementById('mkDict'); if(db) db.addEventListener('click',function(){ ensureAudio(); show('screen-dictation'); startDictSession(dw.slice()); });
  }
  function showMistakeDetail(id){
    var w=loadWrong(); var it=w.items&&w.items[id];
    if(!it){ renderMistakes(); return; }
    var st=document.getElementById('mistStage');
    var h='<div class="big" style="font-size:24px;">'+escapeHtml(it.q)+'</div>';
    if(it.opts&&it.opts.length) h+='<div class="opts" id="mkDetailOpts"></div>';
    h+='<div class="feedback" id="mkDetailFb"></div>'+
      '<div class="hint" style="margin:4px 24px;">来自：'+escapeHtml(it.unitName||'')+' · 已错 '+(it.wc||1)+' 次 · 还需连对 '+(it.lv||1)+' 次出本</div>'+
      '<div class="btn-row"><button class="btn ghost" id="mkDetailBack">返回列表</button></div>';
    st.innerHTML=h;
    var box=document.getElementById('mkDetailOpts');
    if(box) renderOpts(box, it.opts, function(v,o){
      box.dataset.lock='1';
      if(v===it.ans){
        o.classList.add('right'); playCorrect(); resolveWrong(id);
        document.getElementById('mkDetailFb').textContent='答对了！'; document.getElementById('mkDetailFb').className='feedback good';
        speak('答对了！','zh-CN');
      } else {
        o.classList.add('wrong');
        box.querySelectorAll('.opt').forEach(function(x){ if(x.textContent===''+it.ans) x.classList.add('right'); });
        addWrong({id:id,subject:it.subject,unitName:it.unitName,q:it.q,opts:it.opts,ans:it.ans});
        document.getElementById('mkDetailFb').textContent='正确答案：'+it.ans; document.getElementById('mkDetailFb').className='feedback soft';
        speak('正确答案是'+it.ans, it.subject==='english'?'en-US':'zh-CN');
      }
      setTimeout(function(){ var w2=loadWrong(); if(!w2.items||!w2.items[id]){ renderMistakes(); } else { showMistakeDetail(id); } }, 1300);
    });
    document.getElementById('mkDetailBack').addEventListener('click',function(){ renderMistakes(); });
  }
  var mkQueue=null;
  function startMistakePractice(){
    mkQueue=mistakeItems().map(function(it){ it._sw=0; return it; });
    if(!mkQueue.length){ renderMistakes(); return; }
    showMistakeQ();
  }
  function showMistakeQ(){
    if(!mkQueue||!mkQueue.length){ renderMistakeAllDone(); return; }
    var it=mkQueue[0];
    var st=document.getElementById('mistStage');
    var h='<div class="progress-text">📕 错题重练 · 还剩 '+mkQueue.length+' 题</div>'+
      '<div class="big" id="mkQText">'+escapeHtml(it.q)+'</div>'+
      '<div class="opts" id="mkOpts"></div>'+
      '<div class="feedback" id="mkFb"></div>'+
      '<div class="btn-row"><button class="btn ghost" id="mkSkip">先跳过</button></div>';
    st.innerHTML=h;
    var box=document.getElementById('mkOpts');
    renderOpts(box, it.opts||[], function(v,o){
      box.dataset.lock='1';
      if(v===it.ans){
        o.classList.add('right'); playCorrect(); resolveWrong(it.id);
        document.getElementById('mkFb').textContent='对啦！'; document.getElementById('mkFb').className='feedback good';
        mkQueue.shift(); setTimeout(showMistakeQ, 900);
      } else {
        o.classList.add('wrong');
        box.querySelectorAll('.opt').forEach(function(x){ if(x.textContent===''+it.ans) x.classList.add('right'); });
        addWrong({id:it.id,subject:it.subject,unitName:it.unitName,q:it.q,opts:it.opts,ans:it.ans});
        document.getElementById('mkFb').textContent='正确答案：'+it.ans; document.getElementById('mkFb').className='feedback soft';
        it._sw=(it._sw||0)+1;
        mkQueue.shift();
        if(it._sw<3) mkQueue.push(it);
        setTimeout(showMistakeQ, 1400);
      }
    });
    speak(it.q, it.subject==='english'?'en-US':'zh-CN');
    document.getElementById('mkSkip').addEventListener('click',function(){ ensureAudio(); mkQueue.push(mkQueue.shift()); showMistakeQ(); });
  }
  function renderMistakeAllDone(){
    var st=document.getElementById('mistStage');
    st.innerHTML='<div class="hero-emoji">🏅</div><div class="big">错题清零啦！</div><div class="hint" style="margin:8px 24px;">这一轮的错题都练会了。</div>';
    playWin(); speak('错题都练会了，太棒了！','zh-CN');
    renderHome();
  }

  /* ================= 笔顺跟写（田字格 · 逐笔引导 + 手指描红） ================= */
  var TZ_WORDS=Object.keys(STROKE_DATA);
  var tzCur=null, tzIdx=0, tzTimer=null, tzDraw=false, tzLast=null;

  function openWriting(){ renderWritePicker(); show('screen-writing'); }
  function renderWritePicker(){
    var st=document.getElementById('writeStage');
    st.innerHTML='<div class="hint" style="margin:6px 10px;">选一个字，用手指在田字格里跟着写。<br>点「下一笔」听笔画顺序，点「擦掉重写」可以随时重来。</div>'+
      '<div class="tz-word-row">'+TZ_WORDS.map(function(w){
        return '<div class="tz-chip" data-w="'+w+'">'+w+'</div>';
      }).join('')+'</div>'+
      '<div class="hint">第一批 '+TZ_WORDS.length+' 个字，会陆续增加。</div>';
    st.querySelectorAll('[data-w]').forEach(function(c){
      c.addEventListener('click',function(){ ensureAudio(); openTzWord(c.dataset.w); });
    });
  }
  function openTzWord(w){
    var strokes=STROKE_DATA[w]||[];
    if(!strokes.length) return;
    tzCur=w; tzIdx=0;
    var st=document.getElementById('writeStage');
    st.innerHTML='<div class="bs-han" style="text-align:center;">'+w+'</div>'+
      '<div class="tz-wrap">'+
        '<div class="tz-grid"><div class="tz-ghost">'+w+'</div><canvas class="tz-canvas" id="tzCanvas"></canvas></div>'+
        '<div class="tz-idx" id="tzIdx"></div>'+
        '<div class="bs-strokes" id="tzList">'+strokes.map(function(s,i){
          return '<span class="bs-step" data-tz="'+i+'">'+(i+1)+'. '+s+'</span>';
        }).join('')+'</div>'+
        '<div class="tz-bar">'+
          '<button class="btn tiny" id="tzPrev">上一笔</button>'+
          '<button class="btn tiny" id="tzNext">下一笔</button>'+
          '<button class="btn tiny secondary" id="tzPlay">看全部笔顺</button>'+
          '<button class="btn tiny ghost" id="tzClear">擦掉重写</button>'+
        '</div>'+
      '</div>'+
      '<div class="btn-row"><button class="btn secondary" id="tzBack">换一个字</button></div>';
    tzPaintOnly(0);
    document.getElementById('tzPrev').addEventListener('click',function(){ ensureAudio(); tzPaint(Math.max(0,tzIdx-1)); });
    document.getElementById('tzNext').addEventListener('click',function(){ ensureAudio(); tzPaint(Math.min(strokes.length-1,tzIdx+1)); });
    document.getElementById('tzPlay').addEventListener('click',function(){ ensureAudio(); tzPlayAll(); });
    document.getElementById('tzClear').addEventListener('click',function(){ tzClearInk(); });
    document.getElementById('tzBack').addEventListener('click',function(){ tzStopPlay(); renderWritePicker(); });
    tzSetupCanvas();
    speak(w+'。一共 '+strokes.length+' 笔。第一笔，'+strokes[0]+'。','zh-CN');
  }
  function tzPaintOnly(i){
    var strokes=STROKE_DATA[tzCur]||[];
    if(i<0) i=0; if(i>strokes.length-1) i=strokes.length-1;
    tzIdx=i;
    var idxEl=document.getElementById('tzIdx');
    if(idxEl) idxEl.textContent='第 '+(i+1)+' 笔 / 共 '+strokes.length+' 笔：'+strokes[i];
    var list=document.getElementById('tzList');
    if(list){
      list.querySelectorAll('[data-tz]').forEach(function(el){
        var k=+el.getAttribute('data-tz');
        el.style.background = k<i?'#E8F8E8' : (k===i?'#FFE3D2':'#FFFFFF');
        el.style.borderColor = k<i?'#4CAF50' : (k===i?'#FF8A4C':'#EFE3D6');
        el.style.color = k===i?'#E86A2A' : (k<i?'#2A6F2A':'#8A7A70');
        el.style.fontWeight = k===i?'700':'400';
      });
    }
  }
  function tzPaint(i){ tzPaintOnly(i); var strokes=STROKE_DATA[tzCur]||[]; if(tzIdx>0) speak('第 '+(tzIdx+1)+' 笔，'+strokes[tzIdx],'zh-CN'); }
  function tzPlayAll(){
    tzStopPlay();
    var strokes=STROKE_DATA[tzCur]||[];
    tzPaintOnly(0); speak(strokes[0],'zh-CN');
    var k=1;
    tzTimer=setInterval(function(){
      if(k>=strokes.length){ tzStopPlay(); return; }
      tzPaintOnly(k); speak(strokes[k],'zh-CN'); k++;
    },1100);
  }
  function tzStopPlay(){ if(tzTimer){ clearInterval(tzTimer); tzTimer=null; } }
  function tzSetupCanvas(){
    var cv=document.getElementById('tzCanvas');
    if(!cv) return;
    var rect=cv.getBoundingClientRect();
    var dpr=window.devicePixelRatio||1;
    if(!rect.width||!rect.height) return;
    cv.width=Math.round(rect.width*dpr);
    cv.height=Math.round(rect.height*dpr);
    var ctx=cv.getContext('2d');
    if(!ctx) return;
    ctx.scale(dpr,dpr);
    ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='#E86A2A';
    tzDraw=false;
    function tzPos(e){
      var r=cv.getBoundingClientRect();
      return {x:e.clientX-r.left, y:e.clientY-r.top};
    }
    cv.addEventListener('pointerdown',function(e){
      e.preventDefault(); tzDraw=true; tzLast=tzPos(e);
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    });
    cv.addEventListener('pointermove',function(e){
      if(!tzDraw) return;
      e.preventDefault();
      var p=tzPos(e);
      ctx.beginPath(); ctx.moveTo(tzLast.x,tzLast.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      tzLast=p;
    });
    cv.addEventListener('pointerup',function(){ tzDraw=false; });
    cv.addEventListener('pointercancel',function(){ tzDraw=false; });
    cv.addEventListener('pointerleave',function(){ tzDraw=false; });
  }
  function tzClearInk(){
    var cv=document.getElementById('tzCanvas');
    if(!cv) return;
    var ctx=cv.getContext('2d');
    if(ctx) ctx.clearRect(0,0,cv.width,cv.height);
  }

  /* ---- 新功能入口绑定 ---- */
  var _btd=document.getElementById('btnToolDict');
  if(_btd) _btd.addEventListener('click',function(){ ensureAudio(); openDictation(); });
  var _bts=document.getElementById('btnToolSprint');
  if(_bts) _bts.addEventListener('click',function(){ ensureAudio(); openSprint(); });
  var _btw=document.getElementById('btnToolWrong');
  if(_btw) _btw.addEventListener('click',function(){ ensureAudio(); openMistakes(); });
  var _bdh=document.getElementById('btnDictHome');
  if(_bdh) _bdh.addEventListener('click',function(){ renderHome(); show('screen-home'); });
  var _bsh=document.getElementById('btnSprintHome');
  if(_bsh) _bsh.addEventListener('click',function(){ stopSprint(); renderHome(); show('screen-home'); });
  var _bmh=document.getElementById('btnMistHome');
  if(_bmh) _bmh.addEventListener('click',function(){ renderHome(); show('screen-home'); });
  var _btwr=document.getElementById('btnToolWrite');
  if(_btwr) _btwr.addEventListener('click',function(){ ensureAudio(); openWriting(); });
  var _bwh=document.getElementById('btnWriteHome');
  if(_bwh) _bwh.addEventListener('click',function(){ tzStopPlay(); renderHome(); show('screen-home'); });

  /* ================= 启动 ================= */
  loadProfile();
  if(!profile){ show('screen-profile'); }
  else { loadState(); refreshProfileTag(); renderHome(); show('screen-home'); }
})();
</script>
